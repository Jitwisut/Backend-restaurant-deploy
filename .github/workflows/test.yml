name: Backend CI/CD

# 1. ทำงานเมื่อไหร่? -> เมื่อมีการ Push หรือ Pull Request ไปที่ branch main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Bun Tests
    runs-on: ubuntu-latest

    # 2. พระเอกของเรา: สร้าง Database จำลองขึ้นมาเพื่องานนี้โดยเฉพาะ
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: restaurant_test # <-- ชื่อ DB ต้องตรงกับที่ใช้ใน Test
        ports:
          - 5432:5432
        # รอให้ Database พร้อมใช้งานก่อนเริ่ม Test (Health Check)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 3. ดึง Code ล่าสุดมา
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. ติดตั้ง Bun
      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # 5. ติดตั้ง Dependencies (node_modules)
      - name: Install dependencies
        run: bun install

      # 6. สร้างไฟล์ .env จำลอง (สำคัญมาก! เพราะบน GitHub ไม่มีไฟล์ .env ของเรา)
      - name: Create .env file
        run: |
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_NAME=restaurant_test" >> .env
          echo "JWT_SECRET=super-secret-test-key-for-ci" >> .env
          echo "ORIGIN_URL=http://localhost:3000" >> .env
          echo "DATABASE_URL=postgres://postgres:password@localhost:5432/restaurant_test" >> .env

      # 7. เริ่มรัน Test
      - name: Run Tests
        run: bun test

      - name: Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
          vercel-args: "--prod"
